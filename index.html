<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test manette</title>
    <meta name="description" content="Curseur en croix piloté à la souris ou à la manette de jeu." />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="cursor" aria-hidden="true">
      <span class="cursor__h"></span>
      <span class="cursor__v"></span>
    </div>

    <aside class="hud" aria-live="polite">
      <p class="hud__row"><span>Source</span><strong data-source>souris</strong></p>
      <p class="hud__row"><span>Manette</span><strong data-pad>aucune — appuie sur un bouton</strong></p>
      <p class="hud__row"><span>Vibration</span><strong data-rumble>—</strong></p>
      <p class="hud__row"><span>Position</span><strong data-pos>—</strong></p>
      <div class="hud__sticks">
        <div class="stick" data-stick="0"><span></span></div>
        <div class="stick" data-stick="1"><span></span></div>
      </div>
      <ul class="hud__buttons" data-buttons></ul>
      <p class="hud__hint" data-hint>Stick gauche : déplacer · Stick droit : précision · A / RT / clic : marquer · B / clic droit : effacer</p>
    </aside>
  </body>
</html>
